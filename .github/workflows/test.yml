name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/research.py demo --project /tmp/demo-project
      - run: python scripts/research.py verify --project /tmp/demo-project
      - run: pip install -r requirements-excel.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/export_xlsx.py --project /tmp/demo-project
